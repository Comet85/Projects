version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    user: root
    deploy:
      resources:
        limits:
          memory: 1G
    mem_limit: 1g
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /Docker/Jenkins/Home:/var/jenkins_home
      - /Docker/Jenkins/Workspace:/var/jenkins_home/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=-Xms256m -Xmx512m -Djenkins.install.runSetupWizard=false
    networks:
      public-net:
        ipv4_address: 10.10.0.250
      internal-net:
        ipv4_address: 10.20.0.250

networks:
  public-net:
    name: public-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/16
          gateway: 10.10.0.1
  internal-net:
    name: internal-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.0.0/16
          gateway: 10.20.0.1
