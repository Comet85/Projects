version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - /Docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /Docker/nginx/html:/usr/share/nginx/html:ro
      - /Docker/nginx/logs:/var/log/nginx
      - /Docker/nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - TZ=Asia/Seoul
    networks:
      public-net:
        ipv4_address: 10.10.0.10
      internal-net:
        ipv4_address: 10.20.0.10

networks:
  public-net:
    name: public-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/16
          gateway: 10.10.0.1
  internal-net:
    name: internal-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.0.0/16
          gateway: 10.20.0.1
